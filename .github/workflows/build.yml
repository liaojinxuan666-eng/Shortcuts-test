name: Build IntentProbe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        description: "使用 Secrets 里的证书签名（需要先配置好 Secrets）"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: IntentProbe
  SCHEME_MAC: IntentProbeMac

# 默认 token 多半是只读，upload-artifact / Release 都会 403
permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 环境信息
        run: |
          set -x
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -i -E "iphone|macos" || true

      # 网页上传/zip 导入会丢失可执行位，统一修一次
      - name: 修复脚本权限
        run: |
          chmod +x scripts/*.sh 2>/dev/null || true
          chmod +x tools/*.py   2>/dev/null || true
          ls -l scripts/ tools/ || true

      - name: 预检（仓库结构 + 源文件清单）
        run: |
          set -uo pipefail
          echo "=== 工作目录 ==="
          pwd
          echo
          echo "=== 顶层内容 ==="
          ls -la
          echo
          echo "=== git 跟踪的文件 ==="
          git ls-files | sed 's/^/  /' || true
          echo

          EXPECTED="IntentProbeApp.swift ProbeLog.swift ProbeIntents.swift ProbeEntity.swift ProbeSnippet.swift ProbeShortcuts.swift"
          echo "=== 源文件逐项检查（应有 6 个） ==="
          fail=0
          for f in $EXPECTED; do
            if [ -f "IntentProbe/$f" ]; then
              printf "  OK    %-24s %6s bytes\n" "$f" "$(wc -c < "IntentProbe/$f" | tr -d ' ')"
            else
              printf "  MISS  %-24s\n" "$f"
              fail=1
            fi
          done
          echo
          echo "=== IntentProbe/ 实际内容 ==="
          ls -la IntentProbe/ 2>/dev/null || echo "  （目录不存在）"
          echo

          if [ "$fail" = "1" ]; then
            echo "::error title=源文件不全::IntentProbe/ 下缺少上表标记为 MISS 的文件。"
            echo "::error::常见原因：用网页逐个上传时漏了文件，或只拖了部分 .swift 进仓库。"
            echo "::error::修复：从仓库根执行 —— git ls-files | grep IntentProbe"
            echo "::error::确认 6 个 .swift 都在，缺的补上后 commit + push。"
            exit 1
          fi
          echo "预检通过：6 个源文件齐全"

      - name: 安装 XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 Xcode 工程
        run: xcodegen generate

      # ------------------------------------------------------------ 签名材料探测
      - name: 探测签名材料
        id: probe
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          WANT="${{ github.event.inputs.sign || 'true' }}"
          if [ "$WANT" = "true" ] && [ -n "$CERT" ] && [ -n "$PROFILE" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::检测到证书 Secrets，将产出**已签名** IPA"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置证书 Secrets，只产出**未签名** IPA（可用 Sideloadly / AltStore / TrollStore 自行签名安装）"
          fi

      - name: 导入证书与描述文件
        if: steps.probe.outputs.signed == 'true'
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"

          echo -n "$CERT"    | base64 --decode -o "$CERT_PATH"
          echo -n "$PROFILE" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

          NAME=$(security cms -D -i "$PROFILE_PATH" | plutil -extract Name raw -)
          UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "::notice::描述文件已导入：$NAME ($UUID)"

      # ------------------------------------------------------------ iOS 编译
      - name: 编译 iOS（已签名）
        if: steps.probe.outputs.signed == 'true'
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        run: |
          set -o pipefail
          xcodebuild \
            -project IntentProbe.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_ID:-com.probe.intentprobe}" \
            build | tee build.log

      - name: 编译 iOS（未签名）
        if: steps.probe.outputs.signed != 'true'
        run: |
          set -o pipefail
          xcodebuild \
            -project IntentProbe.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log

      # ------------------------------------------------------------ macOS 编译
      # 存在理由：H3（元数据变异）在 macOS 上成本极低，改文件 + ad-hoc 重签即可
      - name: 编译 macOS（未签名）
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project IntentProbe.xcodeproj \
            -scheme "$SCHEME_MAC" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build-mac \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build-mac.log

      # ------------------------------------------------------------ 打包
      - name: 打包 IPA / App
        run: bash scripts/make_ipa.sh

      - name: 导出 App Intents 元数据（H3 研究素材）
        if: always()
        run: |
          APP=$(find build/Build/Products -maxdepth 3 -name "IntentProbe.app" -type d 2>/dev/null | head -1 || true)
          if [ -n "${APP:-}" ] && [ -d "$APP/Metadata.appintents" ]; then
            mkdir -p dist/metadata
            cp -R "$APP/Metadata.appintents" dist/metadata/
            echo "=== Metadata.appintents 内容 ==="
            find dist/metadata -type f -exec ls -la {} \;
            echo "=== version.json ==="
            cat "$APP/Metadata.appintents/version.json" 2>/dev/null || true
            echo "=== extract.actionsdata 头部（hex） ==="
            xxd -l 256 "$APP/Metadata.appintents/extract.actionsdata" 2>/dev/null || true
          else
            echo "::warning::没有找到 Metadata.appintents，App Intents 可能没被编译进去"
          fi

      # ------------------------------------------------------------ 产物
      # artifact 只是备份，失败不影响 Release
      - name: 上传产物（artifact，best-effort）
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: IntentProbe-${{ github.sha }}
          path: |
            dist/*.ipa
            dist/*.zip
            dist/metadata/**
          if-no-files-found: warn
          retention-days: 30

      - name: 上传编译日志（artifact，best-effort）
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            build.log
            build-mac.log
          if-no-files-found: ignore

      # ------------------------------------------------------------ Release
      - name: 发布到 Release
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail

          IPA=$(ls dist/*.ipa 2>/dev/null | head -1 || true)
          ZIP=$(ls dist/*.zip 2>/dev/null | head -1 || true)

          if [ -z "$IPA" ] && [ -z "$ZIP" ]; then
            echo "::warning::dist 下没有 ipa/zip，跳过 Release 发布"
            ls -la dist 2>/dev/null || true
            exit 0
          fi

          TAG="probe-latest"
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          WHEN=$(date -u '+%Y-%m-%d %H:%M UTC')

          # 附件：安装包 + App Intents 元数据（H3 研究素材）
          FILES=$(ls dist/*.ipa dist/*.zip 2>/dev/null || true)
          META=$(find dist/metadata -type f 2>/dev/null | tr '\n' ' ' || true)

          echo "=== 待上传 ==="
          echo "$FILES"
          echo "$META"

          NOTES=$(cat <<EOF
          **自动构建 · $WHEN**

          | 项 | 值 |
          |---|---|
          | 提交 | \`$SHORT\` |
          | 分支 | \`$GITHUB_REF_NAME\` |
          | 签名 | 未签名（需自行 Sideloadly / AltStore / TrollStore 重签） |

          ### 产物
          - \`IntentProbe-unsigned.ipa\` — iOS 安装包（未签名）
          - \`IntentProbeMac-macos.zip\` — macOS 版，改元数据后 \`codesign -s -\` 即可跑 H3 变异
          - \`extract.actionsdata\` — Shortcuts 索引第三方 App 时解析的二进制 blob
          - \`version.json\` — 元数据格式版本

          > 装好后打开「快捷指令 → App 快捷指令」，能看到 5 个探针指令才算信任边界建立成功。
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新附件"
            gh release edit "$TAG" --notes "$NOTES" --latest
          else
            echo "创建 Release $TAG"
            gh release create "$TAG" \
              --title "IntentProbe 最新构建" \
              --notes "$NOTES" \
              --latest
          fi

          # shellcheck disable=SC2086
          gh release upload "$TAG" $FILES $META --clobber

          echo
          echo "=== 发布完成 ==="
          gh release view "$TAG" --json url,assets \
            --jq '.url, (.assets[] | "  \(.name)  \(.size) bytes")'

      - name: 摘要
        if: always()
        run: |
          {
            echo "## IntentProbe 构建结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 签名 | ${{ steps.probe.outputs.signed == 'true' && '✅ 已签名' || '⚠️ 未签名' }} |"
            echo "| 提交 | \`${{ github.sha }}\` |"
            echo ""
            echo "### 产物"
            ls -lh dist/*.ipa dist/*.zip 2>/dev/null || echo "（无）"
            echo ""
            echo "### Metadata.appintents"
            find dist/metadata -type f 2>/dev/null | head -20 || echo "（无）"
            echo ""
            echo "### Release"
            echo "https://github.com/${{ github.repository }}/releases/tag/probe-latest"
          } >> "$GITHUB_STEP_SUMMARY"
