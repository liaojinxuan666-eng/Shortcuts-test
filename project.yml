name: IntentProbe
options:
  bundleIdPrefix: com.probe
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEAD_CODE_STRIPPING: YES
    ENABLE_BITCODE: NO

targets:
  # ---------------------------------------------------------------- iOS
  IntentProbe:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: IntentProbe
    info:
      path: Support/Info-iOS.plist
      properties:
        CFBundleDisplayName: IntentProbe
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.probe.intentprobe
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic

  # ---------------------------------------------------------------- macOS
  # macOS 版存在的唯一理由：H3（元数据变异）在 macOS 上做成本极低——
  # 改文件、ad-hoc 重签、双击运行，不需要证书也不需要真机。
  IntentProbeMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: IntentProbe
    info:
      path: Support/Info-macOS.plist
      properties:
        CFBundleDisplayName: IntentProbeMac
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.probe.intentprobe.mac
        CODE_SIGN_STYLE: Automatic

schemes:
  IntentProbe:
    build:
      targets:
        IntentProbe: all
    run:
      config: Debug
    archive:
      config: Release

  IntentProbeMac:
    build:
      targets:
        IntentProbeMac: all
    run:
      config: Debug
    archive:
      config: Release
